<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0D5C4D" />
      <stop offset="100%" stop-color="#073B32" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing border -->
  <circle cx="256" cy="256" r="236" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Subtle background geometric pattern (Islamic star) -->
  <path d="M 256,70 L 300,160 L 396,116 L 352,206 L 442,256 L 352,306 L 396,396 L 300,352 L 256,442 L 212,352 L 116,396 L 160,306 L 70,256 L 160,206 L 116,116 L 212,160 Z" 
        fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="4" stroke-linejoin="round" />
        
  <!-- Crescent Moon -->
  <path d="M 280,150 
           A 110,110 0 1,0 350,330 
           A 90,90 0 1,1 280,150 Z" 
        fill="url(#gold-grad)" filter="url(#glow)" />
        
  <!-- Glowing Star -->
  <path d="M 335,215 L 340,230 L 355,230 L 343,240 L 347,255 L 335,245 L 323,255 L 327,240 L 315,230 L 330,230 Z" 
        fill="url(#gold-grad)" filter="url(#glow)" />
</svg>
